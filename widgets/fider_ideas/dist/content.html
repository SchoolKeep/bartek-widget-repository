<style>
  :host {
    --accent: {{ accent_color }};
    --accent-light: color-mix(in srgb, {{ accent_color }} 12%, white);
    --accent-hover: color-mix(in srgb, {{ accent_color }} 85%, black);
    --text-primary: #1a1a2e;
    --text-secondary: #64748b;
    --bg-surface: #ffffff;
    --bg-page: #f8fafc;
    --border: #e2e8f0;
    --radius: 12px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .fi-widget {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-primary);
    max-width: 800px;
    margin: 0 auto;
  }

  /* Header */
  .fi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .fi-title {
    font-size: clamp(1.25rem, 2.5vw, 1.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .fi-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .fi-btn-primary {
    background: var(--accent);
    color: white;
  }

  .fi-btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .fi-btn-primary:active { transform: translateY(0); }

  .fi-btn-secondary {
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  .fi-btn-secondary:hover { background: var(--bg-page); border-color: var(--accent); }

  /* Idea list */
  .fi-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .fi-idea {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 16px 20px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    transition: all 0.15s ease;
    cursor: pointer;
  }

  .fi-idea:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }

  /* Vote pill */
  .fi-votes {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    padding: 8px 4px;
    background: var(--accent-light);
    border-radius: 8px;
    flex-shrink: 0;
  }

  .fi-votes-arrow {
    font-size: 10px;
    color: var(--accent);
    line-height: 1;
  }

  .fi-votes-count {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  /* Idea content */
  .fi-idea-body {
    flex: 1;
    min-width: 0;
  }

  .fi-idea-title {
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 4px;
    color: var(--text-primary);
  }

  .fi-idea-desc {
    font-size: 0.8125rem;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Meta row */
  .fi-idea-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
  }

  .fi-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .fi-meta-icon {
    font-size: 0.8125rem;
    line-height: 1;
  }

  /* Status badges */
  .fi-status {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .fi-status-open { background: #dbeafe; color: #1d4ed8; }
  .fi-status-planned { background: #e0e7ff; color: #4338ca; }
  .fi-status-started { background: #fef3c7; color: #b45309; }
  .fi-status-completed { background: #d1fae5; color: #065f46; }
  .fi-status-declined { background: #fee2e2; color: #b91c1c; }
  .fi-status-duplicate { background: #f1f5f9; color: #64748b; }

  /* States */
  .fi-loading, .fi-empty, .fi-error {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-secondary);
  }

  .fi-loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: fi-spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes fi-spin { to { transform: rotate(360deg); } }

  .fi-empty-icon, .fi-error-icon {
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .fi-state-title {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .fi-state-desc {
    font-size: 0.8125rem;
  }

  /* Modal overlay */
  .fi-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(4px);
  }

  .fi-overlay.fi-visible {
    display: flex;
  }

  .fi-modal {
    background: var(--bg-surface);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .fi-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 0;
  }

  .fi-modal-title {
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .fi-modal-close {
    width: 32px;
    height: 32px;
    border: none;
    background: var(--bg-page);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.125rem;
    color: var(--text-secondary);
    transition: all 0.15s ease;
  }

  .fi-modal-close:hover { background: var(--border); color: var(--text-primary); }

  .fi-modal-body {
    padding: 20px 24px 24px;
  }

  .fi-field {
    margin-bottom: 16px;
  }

  .fi-label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .fi-input, .fi-textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.875rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-surface);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    outline: none;
  }

  .fi-input:focus, .fi-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  .fi-textarea {
    resize: vertical;
    min-height: 100px;
    line-height: 1.5;
  }

  .fi-modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .fi-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Success toast */
  .fi-toast {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: #065f46;
    color: white;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 10000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .fi-toast.fi-visible { display: block; }

  /* Responsive */
  @media (max-width: 600px) {
    .fi-idea { padding: 12px 14px; gap: 12px; }
    .fi-votes { min-width: 44px; padding: 6px 4px; }
    .fi-votes-count { font-size: 1rem; }
    .fi-header { gap: 12px; }
  }
</style>

<div class="fi-widget">
  <div class="fi-header">
    <h2 class="fi-title">{{ widget_title }}</h2>
    <button class="fi-btn fi-btn-primary" id="fi-submit-btn">
      <span>+</span> Submit Idea
    </button>
  </div>

  <div id="fi-loading" class="fi-loading">
    <div class="fi-loading-spinner"></div>
    <div class="fi-state-desc">Loading ideas...</div>
  </div>

  <div id="fi-error" class="fi-error" style="display:none;">
    <div class="fi-error-icon">!</div>
    <div class="fi-state-title">Something went wrong</div>
    <div class="fi-state-desc" id="fi-error-msg">Could not load ideas. Please try again later.</div>
  </div>

  <div id="fi-empty" class="fi-empty" style="display:none;">
    <div class="fi-empty-icon">&#x1f4a1;</div>
    <div class="fi-state-title">No ideas yet</div>
    <div class="fi-state-desc">Be the first to submit a product idea!</div>
  </div>

  <div id="fi-list" class="fi-list" style="display:none;"></div>
</div>

<div class="fi-overlay" id="fi-overlay">
  <div class="fi-modal">
    <div class="fi-modal-header">
      <h3 class="fi-modal-title">Submit an Idea</h3>
      <button class="fi-modal-close" id="fi-close-btn">&times;</button>
    </div>
    <div class="fi-modal-body">
      <div class="fi-field">
        <label class="fi-label" for="fi-idea-title">Title</label>
        <input class="fi-input" id="fi-idea-title" type="text" placeholder="A short summary of your idea" maxlength="200">
      </div>
      <div class="fi-field">
        <label class="fi-label" for="fi-idea-desc">Description</label>
        <textarea class="fi-textarea" id="fi-idea-desc" placeholder="Explain your idea in more detail... What problem does it solve?"></textarea>
      </div>
      <div class="fi-modal-actions">
        <button class="fi-btn fi-btn-secondary" id="fi-cancel-btn">Cancel</button>
        <button class="fi-btn fi-btn-primary" id="fi-post-btn">Submit</button>
      </div>
    </div>
  </div>
</div>

<div class="fi-toast" id="fi-toast">Idea submitted successfully!</div>

<script src="https://static.customer-hub.northpass.com/widget-sdk/latest/index.umd.js"></script>
<script>
  (function () {
    var host = document.querySelector('gs-cc-registry-widget[data-widget-type*="fider_ideas"]');
    if (!host || !host.shadowRoot) return;
    if (host._fiderInit) return;
    host._fiderInit = true;

    var root = host.shadowRoot;
    var sdk = new WidgetServiceSDK();
    var portalUrl = ('{{ portal_url }}').replace(/\/+$/, '');

    var STATUS_MAP = {
      open: 'open',
      planned: 'planned',
      started: 'started',
      completed: 'completed',
      declined: 'declined',
      duplicate: 'duplicate'
    };

    function $(sel) { return root.querySelector(sel); }

    function showState(state) {
      $('#fi-loading').style.display = state === 'loading' ? '' : 'none';
      $('#fi-error').style.display = state === 'error' ? '' : 'none';
      $('#fi-empty').style.display = state === 'empty' ? '' : 'none';
      $('#fi-list').style.display = state === 'list' ? '' : 'none';
    }

    function truncate(str, len) {
      if (!str) return '';
      return str.length > len ? str.substring(0, len) + '...' : str;
    }

    function renderIdeas(posts) {
      var list = $('#fi-list');
      list.innerHTML = '';

      if (!posts || posts.length === 0) {
        showState('empty');
        return;
      }

      posts.forEach(function (post) {
        var link = document.createElement('a');
        link.className = 'fi-idea';
        link.href = portalUrl + '/posts/' + post.number + '/' + post.slug;
        link.target = '_blank';
        link.rel = 'noopener';

        var statusClass = STATUS_MAP[post.status] || 'open';
        var statusLabel = post.status.charAt(0).toUpperCase() + post.status.slice(1);

        link.innerHTML =
          '<div class="fi-votes">' +
            '<div class="fi-votes-arrow">&#x25B2;</div>' +
            '<div class="fi-votes-count">' + post.votesCount + '</div>' +
          '</div>' +
          '<div class="fi-idea-body">' +
            '<div class="fi-idea-title">' + escapeHtml(post.title) + '</div>' +
            (post.description ? '<div class="fi-idea-desc">' + escapeHtml(truncate(post.description, 150)) + '</div>' : '') +
            '<div class="fi-idea-meta">' +
              '<span class="fi-status fi-status-' + statusClass + '">' + statusLabel + '</span>' +
              '<span class="fi-meta-item"><span class="fi-meta-icon">&#x1f4ac;</span> ' + post.commentsCount + '</span>' +
            '</div>' +
          '</div>';

        list.appendChild(link);
      });

      showState('list');
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadIdeas() {
      showState('loading');
      try {
        var posts = await sdk.connectors.execute({
          permalink: 'fider-list-posts',
          method: 'GET',
          queryParams: {
            view: '{{ view_filter }}',
            limit: '{{ max_ideas }}'
          }
        });
        renderIdeas(posts);
      } catch (err) {
        $('#fi-error-msg').textContent = err.message || 'Could not load ideas. Please try again later.';
        showState('error');
      }
    }

    // Modal controls
    function openModal() { $('#fi-overlay').classList.add('fi-visible'); }
    function closeModal() {
      $('#fi-overlay').classList.remove('fi-visible');
      $('#fi-idea-title').value = '';
      $('#fi-idea-desc').value = '';
      $('#fi-post-btn').disabled = false;
      $('#fi-post-btn').textContent = 'Submit';
    }

    function showToast(msg) {
      var toast = $('#fi-toast');
      toast.textContent = msg;
      toast.classList.add('fi-visible');
      setTimeout(function () { toast.classList.remove('fi-visible'); }, 3000);
    }

    $('#fi-submit-btn').addEventListener('click', openModal);
    $('#fi-close-btn').addEventListener('click', closeModal);
    $('#fi-cancel-btn').addEventListener('click', closeModal);

    $('#fi-overlay').addEventListener('click', function (e) {
      if (e.target === $('#fi-overlay')) closeModal();
    });

    $('#fi-post-btn').addEventListener('click', async function () {
      var title = $('#fi-idea-title').value.trim();
      var description = $('#fi-idea-desc').value.trim();

      if (!title) {
        $('#fi-idea-title').focus();
        return;
      }

      var btn = $('#fi-post-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        await sdk.connectors.execute({
          permalink: 'fider-create-post',
          method: 'POST',
          body: JSON.stringify({ title: title, description: description })
        });
        closeModal();
        showToast('Idea submitted successfully!');
        loadIdeas();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Submit';
        showToast('Failed to submit: ' + (err.message || 'Unknown error'));
      }
    });

    loadIdeas();
  })();
</script>
